{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "namespace": "online-boutique",
  "resources": [
    "../vendor",
    "namespace.json"
  ],
  "patches": [
    {
      "patch": "{\"apiVersion\": \"apps/v1\", \"kind\": \"Deployment\", \"metadata\": {\"name\": \"loadgenerator\"}, \"$patch\": \"delete\"}"
    },
    {
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"ServiceAccount\", \"metadata\": {\"name\": \"loadgenerator\"}, \"$patch\": \"delete\"}"
    },
    {
      "patch": "{\"apiVersion\": \"v1\", \"kind\": \"Service\", \"metadata\": {\"name\": \"frontend-external\"}, \"$patch\": \"delete\"}"
    },
    {
      "target": {
        "kind": "Deployment"
      },
      "patch": "[{\"op\": \"add\", \"path\": \"/spec/replicas\", \"value\": 1}, {\"op\": \"remove\", \"path\": \"/spec/template/spec/containers/0/resources/limits\"}]"
    }
  ],
  "images": [
    {
      "name": "redis",
      "newTag": "7.4.2-alpine"
    }
  ]
}

{
  "annotations": {},
  "config": {
    "cpu": {
      "preferredMeters": [
        "rapl",
        "hwmon"
      ]
    },
    "debug": {
      "pprof": {
        "enabled": false
      }
    },
    "dev": {
      "fake-cpu-meter": {
        "enabled": false,
        "zones": []
      },
      "fake-gpu-meter": {
        "deviceCount": 1,
        "enabled": false,
        "sharingMode": "time-slicing"
      }
    },
    "experimental": {
      "gpu": {
        "dcgmEndpoint": "",
        "enabled": false,
        "idlePower": 0,
        "metricsCacheTTL": "2s"
      },
      "hwmon": {
        "chipRules": [],
        "forceEnabled": false,
        "zones": []
      },
      "platform": {
        "redfish": {
          "configFile": "/etc/kepler/redfish.yaml",
          "enabled": false,
          "httpTimeout": "5s",
          "nodeName": ""
        }
      }
    },
    "exporter": {
      "prometheus": {
        "debugCollectors": [
          "go"
        ],
        "enabled": true,
        "metricsLevel": [
          "node",
          "process",
          "container",
          "vm",
          "pod"
        ]
      },
      "stdout": {
        "enabled": false
      }
    },
    "host": {
      "procfs": "/host/proc",
      "sysfs": "/host/sys"
    },
    "kube": {
      "config": "",
      "enabled": false,
      "nodeName": "",
      "podInformer": {
        "mode": "kubelet",
        "pollInterval": "15s"
      }
    },
    "log": {
      "format": "text",
      "level": "debug"
    },
    "monitor": {
      "interval": "5s",
      "maxTerminated": 100,
      "minTerminatedEnergyThreshold": 10,
      "staleness": "500ms"
    },
    "rapl": {
      "zones": []
    },
    "web": {
      "configFile": "",
      "listenAddresses": [
        ":28282"
      ]
    }
  },
  "daemonset": {
    "affinity": {},
    "extraEnv": [],
    "extraVolumeMounts": [],
    "extraVolumes": [],
    "hostPID": true,
    "hostUsers": true,
    "livenessProbe": {
      "httpGet": {
        "path": "/probe/livez",
        "port": "http"
      },
      "initialDelaySeconds": 10,
      "periodSeconds": 60
    },
    "nodeSelector": {},
    "nvidia": {
      "driverPath": "/run/nvidia/driver",
      "nvmlInitImage": {
        "repository": "busybox",
        "tag": "1.36.1"
      }
    },
    "priorityClassName": "",
    "readinessProbe": {
      "httpGet": {
        "path": "/probe/readyz",
        "port": "http"
      },
      "initialDelaySeconds": 5,
      "periodSeconds": 10
    },
    "resources": {},
    "securityContext": {
      "allowPrivilegeEscalation": false,
      "appArmorProfile": {
        "type": "Unconfined"
      },
      "capabilities": {
        "add": [
          "SYS_PTRACE"
        ],
        "drop": [
          "ALL"
        ]
      },
      "privileged": false,
      "readOnlyRootFilesystem": true,
      "runAsNonRoot": false,
      "runAsUser": 0,
      "seLinuxOptions": {
        "type": "spc_t"
      },
      "seccompProfile": {
        "type": "RuntimeDefault"
      }
    },
    "startupProbe": {},
    "tolerations": [
      {
        "effect": "NoSchedule",
        "key": "node-role.kubernetes.io/control-plane",
        "operator": "Exists"
      },
      {
        "effect": "NoSchedule",
        "key": "node-role.kubernetes.io/master",
        "operator": "Exists"
      }
    ]
  },
  "dashboards": {
    "annotations": {},
    "enabled": false,
    "labels": {
      "grafana_dashboard": "1"
    },
    "namespace": ""
  },
  "fullnameOverride": "",
  "image": {
    "pullPolicy": "IfNotPresent",
    "repository": "quay.io/sustainable_computing_io/kepler",
    "tag": ""
  },
  "imagePullSecrets": [],
  "labels": {},
  "nameOverride": "",
  "namespace": {
    "create": false,
    "name": "kepler"
  },
  "networkPolicy": {
    "egress": [],
    "enabled": false,
    "ingress": [
      {
        "ports": [
          {
            "port": 28282,
            "protocol": "TCP"
          }
        ]
      }
    ]
  },
  "rbac": {
    "create": true
  },
  "service": {
    "port": 28282,
    "protocol": "TCP",
    "targetPort": "http",
    "type": "ClusterIP"
  },
  "serviceAccount": {
    "create": true,
    "name": "kepler"
  },
  "serviceMonitor": {
    "annotations": {},
    "enabled": false,
    "interval": "5s",
    "labels": {},
    "path": "/metrics"
  }
}
